name: NEXMUSIC Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: NEXMUSIC-Web
          path: dist/
          if-no-files-found: error

  android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Android signing secrets are not configured. APK publishing is skipped; add the four repository secrets to enable signed updates."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Decode persistent Android signing key
        if: steps.signing.outputs.configured == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexmusic-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/nexmusic-release.jks" >> "$GITHUB_ENV"
      - name: Configure release signing and version code
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $((GITHUB_RUN_NUMBER + 1))/" app/build.gradle
      - name: Build signed release APK
        if: steps.signing.outputs.configured == 'true'
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload signed APK artifact
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NEXMUSIC-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish signed APK to rolling GitHub Release
        if: steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NEXMUSIC — Последняя версия
          body: |
            Актуальная подписанная сборка NEXMUSIC для Android.

            Обновления устанавливаются поверх предыдущей версии при сохранении приложения.
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          prerelease: false
          draft: false
